<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#132028">
<meta name="description" content="Coil Out: Snake Puzzle. Tap a snake with a clear path and it slithers out of the courtyard, head first. Clear every snake without bumping.">
<title>Coil Out: Snake Puzzle</title>
<style>
:root{
  --dusk-0:#0E1920; --dusk-1:#132028; --dusk-2:#1C2F35; --dusk-3:#22363B; --dusk-4:#2B4A4E; --lantern:#F2B65A;
  --ink:#2A1B12; --text:#F3E9D2; --text-2:#B9C4BC; --text-3:#8FA39C;
  --pri:#F6B62E; --pri-hi:#FFD56B; --pri-lip:#B87A12;
  --sec:#2B4A4E; --sec-hi:#3C6266; --sec-lip:#16292C;
  --bone-ui:#EFE3CB; --bone-lip:#BFAE8E; --socket:#16292C; --cue:#FFE6A8;
  --display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--dusk-1);color:var(--text);font-family:var(--ui);font-size:16px;touch-action:none}
@supports (height:100dvh){html,body{height:100dvh}}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}
::selection{background:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--cue);outline-offset:3px}
.piece:focus{outline:none}
[hidden]{display:none!important}
body.booting #app{visibility:hidden}
#boot{position:fixed;inset:0;z-index:5;display:none;place-items:center;pointer-events:none}
body.booting #boot{display:grid}
#boot i{width:14px;height:14px;border-radius:50%;background:var(--text-3);animation:bootP 1.2s ease-in-out infinite}
@keyframes bootP{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.1);opacity:1}}

/* ---------- dusk backdrop ---------- */
#garden{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--dusk-1)}
#garden svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#flies{position:absolute;inset:0;pointer-events:none}
#flies i{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFE6A8;opacity:.15;animation:fly var(--t,3s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes fly{0%{opacity:.15;transform:translate(0,0)}100%{opacity:.6;transform:translate(var(--dx,8px),var(--dy,-8px))}}

#app{position:fixed;inset:0;z-index:1;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- controls: enamel tablets, lit from the top left ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:16px;
  font:800 18px/1 var(--display);color:var(--text);white-space:nowrap;
  background:var(--sec);box-shadow:0 4px 0 var(--sec-lip),0 8px 14px rgba(8,12,16,.35);
  transition:transform .14s cubic-bezier(.2,.9,.3,1.2),box-shadow .14s cubic-bezier(.2,.9,.3,1.2)}
.btn::before,.ib::before{content:"";position:absolute;left:2px;right:2px;top:2px;bottom:50%;border-radius:14px 14px 0 0;border-top:1.5px solid var(--sec-hi);pointer-events:none}
.ib::before{border-radius:50% 50% 0 0}
.btn:active,.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sec-lip),0 3px 8px rgba(8,12,16,.35);transition-duration:.07s}
.btn.pri{height:56px;background:var(--pri);color:var(--ink);box-shadow:0 4px 0 var(--pri-lip),0 8px 14px rgba(8,12,16,.35)}
.btn.pri::before{border-top-color:var(--pri-hi)}
.btn.pri:active{box-shadow:0 1px 0 var(--pri-lip),0 3px 8px rgba(8,12,16,.35)}
.btn.sm{height:48px;font-size:18px}
.btn.txt{height:44px;background:none;box-shadow:none;font-size:16px;font-weight:700;padding:0 18px}
.btn.txt::before{display:none}
.btn.txt:active{transform:none;opacity:.7}
.btn[disabled]{background:var(--dusk-3);color:var(--text-3);box-shadow:none;cursor:default}
.btn[disabled]::before{display:none}
.btn svg,.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .badge{position:absolute;top:-8px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pri);color:var(--ink);font:700 13px/20px var(--ui);text-align:center;box-shadow:0 2px 0 var(--pri-lip)}
.btn .cap{margin-left:auto;font:700 13px/1 var(--ui);opacity:.75}
.ib{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--sec);
  box-shadow:0 4px 0 var(--sec-lip),0 8px 14px rgba(8,12,16,.35);transition:transform .14s cubic-bezier(.2,.9,.3,1.2),box-shadow .14s}
.ib::after{content:"";position:absolute;inset:-2px;border-radius:50%}
.ib[disabled]{opacity:.4;box-shadow:0 4px 0 var(--sec-lip)}
.ib.nudge svg{transform:translateX(-1px)}

/* ---------- home ---------- */
#home{align-items:center;justify-content:center;text-align:center}
.homeCol{width:min(100%,420px);padding:0 24px;display:flex;flex-direction:column;align-items:center}
.wm{position:relative;isolation:isolate;margin:0;font:900 56px/1 var(--display);letter-spacing:-.01em;color:var(--text);-webkit-text-stroke:6px #1B1418;paint-order:stroke fill;white-space:nowrap}
.wm::before{content:attr(data-t);position:absolute;left:0;top:5px;z-index:-1;color:#1B1418;-webkit-text-stroke:6px #1B1418;paint-order:stroke fill}
.sub{margin:10px 0 0;font:600 16px/1.4 var(--ui);color:var(--text-2);text-shadow:0 1px 0 rgba(0,0,0,.25)}
#heroBoard{--hs:min(300px,74vw,36dvh);width:var(--hs);height:calc(var(--hs)*1.19);display:block;margin:14px 0 0;overflow:visible;pointer-events:none}
.menuBtns{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:12px}
.menuBtns .btn{width:100%}
.menuBtns .btn.pri{font-size:20px;padding:0 22px}
.statline{margin-top:16px;font:700 13px/1.2 var(--ui);color:var(--text-2);min-height:16px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.statline:empty{display:none}
.homeFoot{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));display:flex;justify-content:center}
#privacyLink{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:64px;color:var(--text-3);font:600 13px/1 var(--ui);text-decoration:underline;text-underline-offset:3px;padding:0 12px}
#homeMute{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top))}
@media (max-height:700px) and (orientation:portrait){
  .wm{font-size:48px}.sub{margin-top:6px}#heroBoard{--hs:min(240px,66vw,31dvh);margin-top:8px}.menuBtns{margin-top:8px}.statline{margin-top:10px}
  .homeFoot{bottom:max(6px,env(safe-area-inset-bottom))}
}
@media (min-aspect-ratio:11/10){
  #home{align-items:center;justify-content:center}
  .homeCol{width:min(100%,1040px);padding:0 32px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);grid-template-rows:auto auto auto auto;align-content:center;column-gap:clamp(24px,6vw,100px);text-align:left;align-items:start}
  .wm{grid-column:1;grid-row:1;justify-self:start;font-size:clamp(48px,10dvh,80px)}
  .sub{grid-column:1;grid-row:2}
  .menuBtns{grid-column:1;grid-row:3;margin-top:28px;max-width:360px}
  .statline{grid-column:1;grid-row:4;text-align:left}
  #heroBoard{grid-column:2;grid-row:1/5;justify-self:center;align-self:center;margin:0;--hs:min(52dvh,40vw,560px)}
  .homeFoot{justify-content:flex-start;padding-left:max(32px,6vw)}
}
@media (min-width:1200px) and (min-aspect-ratio:11/10){.wm{font-size:72px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  .wm{font-size:44px}.sub{margin-top:6px}.menuBtns{margin-top:14px;gap:10px}.btn.pri{height:52px}.btn{height:46px}.statline{margin-top:8px}
  #heroBoard{--hs:min(80dvh,36vw)}
}

/* ---------- screens with a header ---------- */
.topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;width:min(100%,1100px);margin:0 auto;padding:5px 16px 5px;height:56px;flex:none}
.topbar h2{margin:0;font:800 22px/1.2 var(--display);letter-spacing:-.01em;text-align:center}

/* levels */
#levels{align-items:center}
.lvBody{flex:1;min-height:0;width:min(100%,1100px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 16px 20px;--tile:80px}
@media (min-height:900px) and (min-width:1200px){.lvBody{zoom:1.45}}
.lvLeft{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:358px}
.chapCard{position:relative;width:100%;min-height:112px;border-radius:20px;background:var(--dusk-3);box-shadow:inset 0 1.5px 0 #2F4A4F,0 8px 14px rgba(8,12,16,.3);padding:16px 18px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;touch-action:pan-y}
.chapCard #chName{grid-column:1;grid-row:1;text-align:left;font:800 20px/1.2 var(--display);letter-spacing:-.01em}
.chapCard #chName .cr{display:block;font:700 13px/1.2 var(--ui);color:var(--text-2);margin-top:5px;letter-spacing:0}
.chapCard .emb{grid-column:2;grid-row:1;width:44px;height:44px}
.chapCard .tally{grid-column:1/3;grid-row:2;display:flex;align-items:center;gap:10px;margin-top:12px;font:700 13px/1 var(--ui);color:var(--text-2)}
.chapCard .tally b{display:inline-flex;align-items:center;gap:5px;font:800 16px/1 var(--display);color:var(--text)}
.chapCard .tally b svg{width:16px;height:16px}
.chapCard .track{margin-left:auto;width:120px;height:6px;border-radius:3px;background:#16292C;overflow:hidden}
.chapCard .track i{display:block;height:100%;background:var(--pri);border-radius:3px}
.chapCard .lockNote{display:flex;align-items:center;gap:8px;font:700 13px/1.2 var(--ui);color:var(--text-2)}
.chapCard .lockNote svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.pager{display:flex;align-items:center;justify-content:space-between;width:100%}
#dots{display:flex;gap:6px;align-items:center}
#dots i{width:6px;height:6px;border-radius:3px;background:#3a5358}
#dots i.on{width:18px;background:var(--pri)}
#lvGrid{display:grid;grid-template-columns:repeat(4,var(--tile));grid-auto-rows:var(--tile);gap:12px;justify-content:center}
.tile{position:relative;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:var(--bone-ui);color:var(--ink);box-shadow:0 4px 0 var(--bone-lip),0 8px 12px rgba(8,12,16,.3);transition:transform .14s cubic-bezier(.2,.9,.3,1.2),box-shadow .14s}
.tile::before{content:"";position:absolute;left:2px;right:2px;top:2px;bottom:50%;border-radius:14px 14px 0 0;border-top:1.5px solid rgba(255,255,255,.7);pointer-events:none}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bone-lip),0 3px 6px rgba(8,12,16,.3);transition-duration:.07s}
.tile .n{font:800 20px/1 var(--display);font-variant-numeric:tabular-nums}
.tile .st{display:flex;gap:2px;height:12px}
.tile .st svg{width:12px;height:12px}
.tile.cur{background:var(--pri);box-shadow:0 4px 0 var(--pri-lip),0 8px 12px rgba(8,12,16,.3)}
.tile.cur::before{border-top-color:var(--pri-hi)}
.tile.cur::after{content:"";position:absolute;inset:-3px;border-radius:19px;border:2px solid var(--cue);pointer-events:none;animation:curPulse 1600ms ease-out infinite}
@keyframes curPulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.08);opacity:0}}
.tile.lock{background:#1A2C31;color:var(--text-3);box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.tile.lock::before{display:none}
.tile.lock:active{transform:none}
.tile.shake{animation:tshake 180ms ease-out}
@keyframes tshake{0%,100%{transform:none}25%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  .lvBody{flex-direction:row;align-items:center;justify-content:center;gap:32px;padding-bottom:12px}
  .lvLeft{width:358px;flex:none}
}
@media (max-width:380px){.lvBody{padding:0 12px 16px}#lvGrid{grid-template-columns:repeat(4,1fr);width:100%;max-width:356px;grid-auto-rows:auto}.tile{aspect-ratio:1}.lvLeft{max-width:none}}

/* ---------- game ---------- */
#game{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
#hud{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;width:min(100%,1100px);margin:0 auto;padding:5px 16px 4px;height:56px}
.lvInfo{min-width:0;padding-left:4px}
.lvInfo b{display:block;font:800 18px/1.1 var(--display);white-space:nowrap}
.lvSub{display:flex;gap:8px;align-items:baseline;white-space:nowrap;font:700 13px/1.2 var(--ui);color:var(--text-2);margin-top:2px}
#lvTime{font-variant-numeric:tabular-nums;color:var(--text-3)}
#lvTime::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;vertical-align:middle;margin:0 8px 2px 0;opacity:.7}
.lvInfo .cnt{display:inline-block;position:relative;overflow:hidden;vertical-align:top;height:1.2em}
.lvInfo .cnt i{display:block;font-style:normal;height:1.2em}
.lvInfo .cnt i.old{position:absolute;left:0;top:0;animation:cntOut 120ms ease-out forwards}
.lvInfo .cnt i.new{animation:cntIn 160ms cubic-bezier(.2,.9,.3,1) both}
@keyframes cntOut{to{transform:translateY(-8px);opacity:0}}
@keyframes cntIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#lives{display:flex;align-items:center;justify-content:center;gap:8px;width:84px;height:32px;border-radius:16px;background:rgba(43,74,78,.7)}
#lives.shake{animation:capShake 160ms ease-out}
@keyframes capShake{0%,100%{transform:none}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-3px)}}
#lives svg{width:16px;height:18px;overflow:visible}
#lives .glz{transform-box:fill-box;transform-origin:center}
#lives svg.lose .glz{animation:pipLose 310ms ease-in both}
@keyframes pipLose{0%{transform:scale(1);opacity:1}29%{transform:scale(1.25);opacity:1}100%{transform:translateY(6px) scale(1);opacity:0}}
#stage{position:relative;min-height:0;min-width:0;display:grid;place-items:center}
#board{display:block;overflow:visible;touch-action:none;transform-origin:0 0}
#stage{touch-action:none}
#bar{display:flex;justify-content:center;gap:12px;padding:12px 16px max(20px,env(safe-area-inset-bottom))}
#bar .btn{flex:1 1 0;min-width:0;padding:0 8px;gap:6px;font-size:15px}
#bar .btn svg{width:22px;height:22px}
.hit{fill:none;stroke:transparent;pointer-events:stroke;cursor:pointer}
.focusring{fill:none;stroke:var(--cue);stroke-linecap:round;stroke-linejoin:round;opacity:0;pointer-events:none}
.piece:focus-visible .focusring{opacity:.9}
.hdi{transform-box:fill-box;transform-origin:34% 50%;animation:breathe 3200ms ease-in-out calc(var(--bi,0)*370ms) infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035)}}
.eyeL,.eyeR{transform-box:fill-box;transform-origin:center;animation:blink var(--bd,5.5s) ease-in-out calc(var(--bi,0)*-1.3s) infinite}
@keyframes blink{0%,97.6%,100%{transform:scaleY(1)}98.8%{transform:scaleY(.1)}}
.go .hdi,.go .eyeL,.go .eyeR{animation:none}
.press{transform:translate(calc(var(--hx)*1px),calc(var(--hy)*1px)) scale(.97) translate(calc(var(--hx)*-1px),calc(var(--hy)*-1px));transition:transform 60ms ease-out}
.press .sg{transform:translate(.9px,2.1px)}
.piece.hint .ol{fill:var(--cue);stroke:var(--cue)}
.nudgeA{animation:nudgeA 150ms ease-out}
@keyframes nudgeA{50%{translate:var(--nx) var(--ny)}}
.exitdots circle{fill:var(--cue)}
.lane.stop{fill:none;stroke:var(--cue);stroke-width:3;stroke-linecap:round}
.hintring circle{animation:hintDot 600ms ease-in-out 2}
@keyframes hintDot{0%,100%{transform:scale(1)}50%{transform:scale(1.7)}}
.hintring circle,.tapRing circle{transform-box:fill-box;transform-origin:center}
.tapRing circle{fill:none;stroke:var(--cue);stroke-width:2;vector-effect:non-scaling-stroke;animation:tapRing 1400ms ease-out infinite}
.tapRing circle+circle{animation-delay:500ms}
@keyframes tapRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2600ms ease-out infinite}
@keyframes ripple{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1);opacity:0}}
.burst line{stroke:#FFFDF2;stroke-width:1.8;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:burst 180ms ease-out both}
@keyframes burst{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.2);opacity:0}}
.lit{fill:#FFE9D2;opacity:0;animation:litTile 160ms ease-out}
@keyframes litTile{0%{opacity:0}35%{opacity:.08}100%{opacity:0}}
.wv{animation:tileLift 180ms ease-out both}
@keyframes tileLift{0%{opacity:0;translate:0 0}50%{opacity:1;translate:0 -3px}100%{opacity:0;translate:0 0}}
.kerbN{animation:kerbN 140ms ease-out}
@keyframes kerbN{50%{translate:var(--nx) var(--ny)}}
.born{animation:none}
.fxp{transform-box:fill-box;transform-origin:center;animation:ffUp 380ms ease-out both}
@keyframes ffUp{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}

#tut{position:absolute;inset:0;z-index:3;pointer-events:none}
#tut svg{position:absolute;inset:0;width:100%;height:100%}
#tip{position:absolute;left:16px;right:16px;bottom:calc(var(--barh,84px) + 16px);margin:0 auto;max-width:440px;z-index:4;padding:14px 16px;border-radius:16px;
  background:var(--dusk-3);color:var(--text);font:600 16px/1.4 var(--ui);text-align:center;box-shadow:inset 0 1.5px 0 #2F4A4F,0 8px 18px rgba(8,12,16,.4);pointer-events:none}
#tip.show{animation:tipIn 260ms var(--out)}
@keyframes tipIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#game.sheeted #hud,#game.sheeted #bar,#game.sheeted #tip,#game.sheeted #tut{visibility:hidden}

@media (min-aspect-ratio:11/10){
  #game{display:block}
  #hud{position:absolute;left:0;right:0;top:0;width:auto;padding:8px 16px}
  #stage{position:absolute;left:220px;right:220px;top:16px;bottom:16px}
  #bar{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:200px;flex-direction:column;padding:0}
  #bar .btn{width:100%;flex:none;font-size:18px;padding:0 20px;gap:10px}
  #bar .btn svg{width:24px;height:24px}
  #tip{left:16px;right:auto;width:196px;bottom:auto;top:72px;padding:12px 14px;font-size:16px}
}

/* sheets */
#sheetWrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,16,.55)}
#sheetWrap.show{animation:scrimIn 200ms ease-out}
#sheetWrap.out{animation:scrimOut 220ms ease-in forwards;pointer-events:none}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes scrimOut{to{opacity:0}}
.sheet{position:relative;width:min(100%,520px);border-radius:28px 28px 0 0;background:var(--dusk-3);box-shadow:inset 0 1.5px 0 #2F4A4F;padding:24px 24px max(24px,env(safe-area-inset-bottom));text-align:center}
#sheetWrap.show .sheet{animation:sheetIn 320ms var(--out)}
#sheetWrap.out .sheet{animation:sheetOut 220ms cubic-bezier(.4,0,1,1) forwards}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
.sheet.win{padding-top:48px;margin-top:28px}
.starRow{display:flex;justify-content:center;align-items:flex-end;gap:14px}
.sheet.win .starRow{position:absolute;left:0;right:0;top:-28px}
.sheet .starRow .st{position:relative;width:56px;height:56px;display:block}
.sheet .starRow .st:nth-child(2){transform:translateY(-10px)}
.st svg{width:100%;height:100%;overflow:visible;display:block}
.st.on svg{animation:starPop 320ms cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
.st.off svg{animation:fadeIn 160ms ease-out calc(var(--d,0s) + .1s) both}
@keyframes starPop{0%{transform:scale(0)}65%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.st i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--pri);opacity:0;animation:speck 380ms ease-out var(--d,0s) both}
@keyframes speck{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.sockets{display:flex;justify-content:center;gap:10px;margin:2px 0 14px}
.sockets svg{width:28px;height:31px;overflow:visible}
.sockets.refill svg .glz{animation:refill 200ms ease-out both;animation-delay:calc(var(--i)*110ms);transform-box:fill-box;transform-origin:center}
@keyframes refill{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
.sheet h2{margin:20px 0 0;font:800 28px/1.15 var(--display);letter-spacing:-.01em;color:var(--text)}
.sheet.fail h2{margin-top:0}
.sheet p{margin:8px auto 22px;max-width:34ch;color:var(--text-2);font:600 16px/1.4 var(--ui)}
.sheet p.tline{margin:-12px auto 16px;font:700 14px/1.3 var(--ui);color:var(--text-3);font-variant-numeric:tabular-nums}
.sheet .btns{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.sheet .btns .row{display:flex;gap:12px}
.sheet .btns .row .btn{flex:1}
.sheet .btns .btn.txt{align-self:center;margin-top:-2px}
#toast{position:absolute;left:50%;top:max(72px,env(safe-area-inset-top));transform:translate(-50%,-8px);z-index:30;max-width:90%;padding:10px 16px;border-radius:14px;background:var(--dusk-3);color:var(--text);font:600 16px/1.35 var(--ui);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--out);text-align:center;box-shadow:inset 0 1.5px 0 #2F4A4F,0 8px 18px rgba(8,12,16,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.low{top:auto;bottom:calc(96px + env(safe-area-inset-bottom));font-size:15px;padding:8px 14px;max-width:86%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  .sheet{width:min(100%,640px);padding:18px 20px 16px;display:grid;grid-template-columns:1fr 240px;column-gap:20px;align-items:center;text-align:left}
  .sheet.win{padding-top:34px;margin-top:28px}
  .sheet.win .starRow{left:20px;right:auto;justify-content:flex-start}
  .sheet .starRow .st{width:44px;height:44px}
  .sheet h2{font-size:24px;margin-top:6px;grid-column:1}.sheet.fail h2{margin-top:0}
  .sheet p{margin:4px 0 0;grid-column:1}
  .sheet .btns{grid-column:2;grid-row:1/4;gap:8px}
  .sheet .sockets{grid-column:1;justify-content:flex-start;margin:0 0 6px}
}

/* ---------- new mechanics: day/night dial, shy badges, sleepers, racers ---------- */
#garden #skyTint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s}
body.phase #garden #skyTint{opacity:1}
#garden #skyTint::before,#garden #skyTint::after{content:"";position:absolute;inset:0;transition:opacity .4s ease}
#garden #skyTint::before{background:radial-gradient(120% 90% at 50% 40%,rgba(255,196,120,.12),rgba(255,196,120,0) 70%);opacity:1}
#garden #skyTint::after{background:radial-gradient(120% 90% at 50% 40%,rgba(70,100,200,.26),rgba(20,34,90,.36) 72%);opacity:0}
#garden #skyTint.night::before{opacity:0}
#garden #skyTint.night::after{opacity:1}
#sky{position:absolute;left:50%;top:2px;width:36px;height:36px;margin-left:-18px;z-index:3;pointer-events:none;border-radius:50%;background:var(--dusk-3);box-shadow:inset 0 1.5px 0 #2F4A4F,0 3px 0 rgba(8,12,16,.45)}
#sky svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#sky .dial{transform-box:fill-box;transform-origin:50% 50%;transition:transform .2s ease-out}
#sky.night .dial{transform:rotate(180deg)}
#sky .sunI,#sky .moonI{transition:opacity .2s}
#sky .moonI{opacity:0}#sky.night .moonI{opacity:1}#sky.night .sunI{opacity:0}
#sky.pulse{animation:skyPulse 320ms ease-out}
@keyframes skyPulse{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.dimG{opacity:0;transition:opacity .2s;pointer-events:none}
.dimP{fill:#0A0F14;pointer-events:none}
.piece.asleep .dimG{opacity:.42}
.piece.asleep .eyeL,.piece.asleep .eyeR{animation:none;transform:scaleY(.12)}
.badge-g{pointer-events:none}
.badge-g .leaf{transform-box:fill-box;transform-origin:50% 50%}
.badge-g.u2 .leaf{animation:leafPulse 900ms ease-in-out infinite}
.badge-g.u1 .leaf{animation:leafShake 420ms ease-in-out infinite}
@keyframes leafPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes leafShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.hole{transform-box:fill-box;transform-origin:50% 50%;animation:holeOpen 320ms ease-out both}
@keyframes holeOpen{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.dust circle{transform-box:fill-box;transform-origin:50% 50%;fill:#E6DAC1;animation:dust 420ms ease-out both}
@keyframes dust{0%{opacity:.7;transform:scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
.piece.flash .ol{fill:var(--cue);stroke:var(--cue)}
.dialNote{position:absolute;left:50%;top:40px;transform:translateX(-50%);font:700 12px/1 var(--ui);color:var(--text-2);white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  #flies i,.hdi,.eyeL,.eyeR,.hintring circle,.tapRing circle,.ripple,#boot i,.tile.cur::after,.badge-g .leaf{animation:none!important}
  #sky .dial,#garden #skyTint::before,#garden #skyTint::after,.dimG{transition:none}
  .btn,.ib,.tile{transition:none}
  .nudgeA,.kerbN,.burst line,.lit,.wv{animation-duration:.1s!important}
  .st i{display:none}
  .st.on svg,.st.off svg{animation:fadeIn 120ms ease-out both!important}
  #sheetWrap.show .sheet{animation:fadeIn 120ms ease-out}
  #sheetWrap.out .sheet{animation:fadeIn 120ms ease-in reverse forwards}
  #sheetWrap.out{animation-duration:.12s}
  .lvInfo .cnt i{animation-duration:.1s!important}
  #tip.show{animation:fadeIn 120ms ease-out}
}

  sendMsg('level_started',{world:CHAPTERS[chOf(lvIdx)],level:String(lvIdx+1)});
  say('Level '+(lvIdx+1)+'. '+S.left+' snakes.');
}

/* ---------------- sound buttons ---------------- */
function soundShown(){return !!data.sound&&plat.audio;}
function refreshSoundBtns(){
  ['homeMute','gameMute'].forEach(function(id){
    var b=$('#'+id);if(!b)return;var on=soundShown();
    b.innerHTML=on?IC.on:IC.off;b.setAttribute('aria-label',on?'Sound on':'Sound off');b.setAttribute('aria-pressed',String(!on));
  });
}
function toggleSound(){data.sound=!data.sound;saveData();applyAudio();refreshSoundBtns();sfx('click',1);}

/* ---------------- wiring ---------------- */
/* ---------------- tap ---------------- */
/* The board is always fitted to the screen (no zoom, no pan). A tap fires on pointer-up (never delayed); a pointer that moves more than 10 px is a drag and never becomes a tap. */
var ZG={ptr:null,id:null,t0:0,x0:0,y0:0,bumpId:null,bumpT:0};
var TAP_PX=10,TAP_MS=500;
function stageBox(){var st=$('#stage'),r=st.getBoundingClientRect();return {l:r.left,t:r.top,w:r.width,h:r.height};}
/* which snake does a client point mean: any cell of the snake body, else the nearest snake cell within 0.3 cell (so a thumb that lands on the edge of a tile still counts) */
function hitTest(cx,cy){
  var m=boardEl.getScreenCTM();if(!m||!S)return null;
  var pt=boardEl.createSVGPoint();pt.x=cx;pt.y=cy;var q=pt.matrixTransform(m.inverse());
  var c=Math.floor(q.x/CELL),r=Math.floor(q.y/CELL);
  function own(rr,cc){if(rr<0||cc<0||rr>=H||cc>=W)return undefined;var v=S.occ[rr*W+cc];return (v!==undefined&&v>=0)?v:undefined;}
  var o=own(r,c);if(o!==undefined)return {id:o,r:r,c:c};
  var best=null,bd=1e9,tol=.3*CELL,dr,dc;
  for(dr=-1;dr<=1;dr++)for(dc=-1;dc<=1;dc++){
    o=own(r+dr,c+dc);if(o===undefined)continue;
    var x0=(c+dc)*CELL,y0=(r+dr)*CELL,dx=Math.max(x0-q.x,0,q.x-x0-CELL),dy=Math.max(y0-q.y,0,q.y-y0-CELL),d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best={id:o,r:r+dr,c:c+dc};}
  }
  return (best&&bd<=tol)?best:null;
}
function handleTap(cx,cy){
  var hit=hitTest(cx,cy),now=perfNow();
  if(!hit)return;
  var p=S.pieces[hit.id];if(!p||!p.alive)return;
  if(ZG.bumpId===hit.id&&now-ZG.bumpT<400)return;               /* a double-tap on a blocked snake must not cost two lives */
  var r=tapPiece(hit.id);
  if(r==='bump'){ZG.bumpId=hit.id;ZG.bumpT=now;}
}
function clearPress(){if(ZG.id!==null&&S&&S.pieces[ZG.id]&&S.pieces[ZG.id].el)S.pieces[ZG.id].el.classList.remove('press');ZG.id=null;}
function pdown(e){
  if(!S||screen!=='game'||sheetOpen)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(ZG.ptr!==null){clearPress();ZG.ptr=null;return;}           /* a second finger cancels the tap */
  try{$('#stage').setPointerCapture(e.pointerId);}catch(x){}
  ZG.ptr=e.pointerId;ZG.t0=perfNow();ZG.x0=e.clientX;ZG.y0=e.clientY;
  var h=hitTest(e.clientX,e.clientY);ZG.id=h?h.id:null;
  var p=h&&S.pieces[h.id];if(p&&p.alive&&p.el)p.el.classList.add('press');
  e.preventDefault();
}
function pmove(e){
  if(ZG.ptr!==e.pointerId)return;
  if(Math.hypot(e.clientX-ZG.x0,e.clientY-ZG.y0)>TAP_PX){clearPress();ZG.ptr=-1;}
}
function pup(e){
  if(ZG.ptr!==e.pointerId){if(ZG.ptr===-1&&!e.isPrimary)return;if(ZG.ptr===-1)ZG.ptr=null;return;}
  clearPress();ZG.ptr=null;
  if(perfNow()-ZG.t0<=TAP_MS&&!sheetOpen)handleTap(e.clientX,e.clientY);
}
var stageEl=$('#stage');
stageEl.addEventListener('pointerdown',pdown);
stageEl.addEventListener('pointermove',pmove);
stageEl.addEventListener('pointerup',pup);
stageEl.addEventListener('pointercancel',function(){clearPress();ZG.ptr=null;});
stageEl.addEventListener('lostpointercapture',function(){clearPress();});
boardEl.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var pc=e.target.closest&&e.target.closest('.piece');if(!pc)return;
  e.preventDefault();tapPiece(+pc.getAttribute('data-id'));
});
$('#btnPlay').addEventListener('click',function(){sfx('click',1);startLevel(data.next);});
$('#btnLevels').addEventListener('click',function(){sfx('click',1);S=null;goLevels();});
$('#lvBack').addEventListener('click',function(){sfx('click',1);adBreak('menu');goHome();});
function pageCh(d){var n=PAGES.length;if(chapter+d<0||chapter+d>=n)return;chapter+=d;renderLevels();sfx('click',1);}
$('#chPrev').addEventListener('click',function(){pageCh(-1);});
$('#chNext').addEventListener('click',function(){pageCh(1);});
(function(){var x0=null,c=$('#chCard');
  c.addEventListener('pointerdown',function(e){x0=e.clientX;});
  c.addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40)pageCh(dx<0?1:-1);});
  c.addEventListener('pointercancel',function(){x0=null;});})();
$('#btnMenu').addEventListener('click',function(){sfx('click',1);adBreak('menu');goLevels();});
$('#btnRestart').addEventListener('click',function(){if(!S||blocked())return;sfx('click',1);loadLevel(S.idx);});
$('#btnHint').addEventListener('click',function(){
  if(!S||S.over||S.done||sheetOpen||blocked())return;
  sfx('click',1);
  if(S.hinted!==null&&S.hinted!==undefined){showHint();return;}                       /* hint already paid for: show it again */
  if(!window.CoilAds.rewardedAvailable){                                              /* no ads on this surface: one free hint per level */
    if(S.hintUsed){toast('You used the hint for this level.');return;}
    S.hintUsed=true;showHint();return;
  }
  window.CoilAds.showRewarded('hint',function(ok){
    if(ok&&S&&!S.over&&!S.done){S.hintUsed=true;showHint();}
    else if(!ok)toast('No hint. Watch the ad to the end to get one.');
  });
});
$('#btnUndo').addEventListener('click',function(){
  if(!S||S.over||S.done||sheetOpen||blocked())return;
  sfx('click',1);
  if(!S.hist.length){toast('Nothing to undo yet.');return;}
  if(!S.undoUsed){undoMove();updateHud();return;}                 /* one free undo per attempt; it caps the level at one star */
  if(!window.CoilAds.rewardedAvailable){toast('Undo used on this try.');return;}
  window.CoilAds.showRewarded('undo',function(ok){
    if(ok&&S&&!S.over&&!S.done){undoMove();updateHud();}
    else if(!ok)toast('No undo. Watch the ad to the end to get one.');
  });
});
$('#homeMute').addEventListener('click',toggleSound);
$('#gameMute').addEventListener('click',toggleSound);
$('#lvBack').innerHTML=IC.home;$('#btnMenu').innerHTML=IC.back;$('#chPrev').innerHTML=IC.prev;$('#chNext').innerHTML=IC.next;
$('#btnRestart').innerHTML=IC.restart+'<span>Restart</span>';
$('#btnHint').innerHTML=IC.hint+'<span>Hint</span>';
$('#btnUndo').innerHTML=IC.undo+'<span>Undo</span>';

/* test / debug hooks (read-only helpers; the game does not depend on them) */
window.__coilout={
  levels:LEVELS,solve:solveLevel,
  state:function(){
    return {screen:screen,idx:S?S.idx:null,lives:S?S.lives:null,mistakes:S?S.mistakes:null,left:S?S.left:null,over:S?S.over:null,done:S?S.done:null,extraUsed:S?S.extraUsed:null,
      sheet:sheetOpen?$('#sheetTitle').textContent:null,stars:data.stars.slice(),next:data.next,moves:S?S.moves:null,t:S?S.t:null,undoUsed:S?S.undoUsed:null,hist:S?S.hist.length:null,target:S?S.target:null,time:S?Math.round(S.timeMs!==undefined?S.timeMs:elapsedMs()):null,flying:flying,hinted:S?S.hinted:null,
      day:S?((S.t&1)===0):null,overKind:S?S.overKind:null,phase:S?S.phase:null,
      pieces:S?S.pieces.map(function(p){var mv=p.alive?moveFor(p):null;return {id:p.id,d:p.d,alive:p.alive,free:isFree(p),legal:!!(mv&&mv.ok),kind:p.type,off:p.off,rem:p.type==='timid'?Math.max(0,p.num-S.t):null,asleep:p.el?p.el.classList.contains('asleep'):false,head:p.alive?p.cells[0].slice():null};}):[]};
  },
  tap:tapPiece,
  undo:undoMove,
  skew:function(ms){if(S)S.clk.acc+=ms;showTime();},
  timeInfo:function(){return S?{ms:Math.round(elapsedMs()),target:S.target,started:S.clk.started}:null;},
  cell:function(){return CELLPX;},
  hitAt:function(x,y){var h=hitTest(x,y);return h?h.id:null;},
  cellScreen:function(r,c){var m=boardEl.getScreenCTM(),sb=$('#stage').getBoundingClientRect();return [m.a*(c*CELL+CELL/2)+m.e,m.d*(r*CELL+CELL/2)+m.f];},
  slitherT:function(id){return S.pieces[id].slitherT;},
  load:function(i){show('game');loadLevel(i);},
  loadCustom:function(lv){show('game');loadLevel(0,lv);},
  audio:function(){return {store:STORE,sfx:sfxLog.slice(),musicPaused:music?music.paused:null,audioOn:audioOn(),sound:data.sound,plat:plat.audio,adOpen:adOpen,privacyHidden:$('#privacyLink').hidden,rewarded:window.CoilAds.rewardedAvailable};},
  data:function(){return JSON.parse(JSON.stringify(data));}
};

/* ---------------- boot ---------------- */
/* The game does not start until the platform bridge is ready (or known to be absent). */
initPlatform().then(function(ok){
  if(ok){try{wireBridge();}catch(e){}}
  return loadData();
}).then(function(){
  buildGarden();buildHero();
  initAudio();applyPrivacy();refreshSoundBtns();
  renderHome();show('home');
  document.body.classList.remove('booting');
  /* home screen is on screen: only now tell the platform the game is ready */
  requestAnimationFrame(function(){requestAnimationFrame(function(){sendMsg('game_ready');applyAudio();});});
});

})();
